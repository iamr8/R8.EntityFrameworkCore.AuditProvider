name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test database password. Set the TEST_DB_PASSWORD repository secret (must satisfy SQL Server complexity:
  # at least 8 chars across 3 of upper/lower/digit/symbol). The test fixtures read this same env var.
  TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # test-reporter publishes a check run with per-test results
      pull-requests: write

    # Integration tests hit a real SQL Server and PostgreSQL. The fixtures use hard-coded connection
    # strings (localhost:14331 for SQL Server, localhost:54322 for PostgreSQL, password "MyPassWoRD@#$"),
    # so the service containers below publish exactly those host ports/credentials. GitHub gates the job
    # steps on the service health checks, so the databases are ready before the tests run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          POSTGRES_DB: r8-audit-test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        ports:
          - 14331:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore R8.sln

      # The two shipped libraries enforce TreatWarningsAsErrors in their own csproj, so a warning in the
      # published packages fails the build here. The test project is not warnings-as-errors.
      - name: Build
        run: dotnet build R8.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      # net6.0 uses xunit v2 (VSTest): dotnet test + the trx logger.
      - name: Test net6.0
        run: dotnet test R8.EntityFrameworkCore.AuditProvider.Tests/R8.EntityFrameworkCore.AuditProvider.Tests.csproj -c Release -f net6.0 --no-build --logger "trx;LogFileName=net6.trx" --results-directory test-results

      # net8.0/net10.0 use xunit.v3, which builds a self-running Microsoft.Testing.Platform executable.
      # Run it directly (dotnet run -- ...) with xunit.v3's native "-trx <file>" so the command is
      # independent of the SDK's dotnet-test VSTest/MTP routing.
      - name: Test net8.0
        run: dotnet run --project R8.EntityFrameworkCore.AuditProvider.Tests/R8.EntityFrameworkCore.AuditProvider.Tests.csproj -c Release -f net8.0 --no-build -- -trx test-results/net8.trx

      - name: Test net10.0
        run: dotnet run --project R8.EntityFrameworkCore.AuditProvider.Tests/R8.EntityFrameworkCore.AuditProvider.Tests.csproj -c Release -f net10.0 --no-build -- -trx test-results/net10.trx

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always() # report pass/fail (and which tests) even when the run failed
        with:
          name: Test results
          path: test-results/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
